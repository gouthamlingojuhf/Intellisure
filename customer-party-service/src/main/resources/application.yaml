server:
  port: 8081

spring:
  application:
    name: customer-party-service
  r2dbc:
    url: r2dbc:mysql://localhost:3306/customer_party_db
    username: root
    password:
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: VVGF9BeSRx3K2epQp4/DRnq881+8YixWG3KHI4qTl9I=
  expiration: 30*60

logging:
  level:
    root: INFO
    com.intellisure.customerpartyservice: INFO

  file:
    name: logs/customer-party-service.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 15
      total-size-cap: 100MB