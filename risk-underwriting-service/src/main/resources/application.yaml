server:
  port: 8083

spring:
  application:
    name: risk-underwriting-service

  r2dbc:
    url: r2dbc:mysql://localhost:3306/risk_underwriting_db
    username: root
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: VVGF9BeSRx3K2epQp4/DRnq881+8YixWG3KHI4qTl9I=

logging:
  level:
    root: INFO
    com.intellisure.riskunderwritingservice: INFO

  file:
    name: logs/risk-underwriting-service.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 15
      total-size-cap: 100MB