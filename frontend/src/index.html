<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Safeguard customElements against duplicate definitions injected by browser extensions
    if (typeof window !== 'undefined' && window.customElements && window.customElements.define) {
      const origDefine = window.customElements.define.bind(window.customElements);
      window.customElements.define = function(name, constructor, options) {
        if (window.customElements.get(name)) {
          return;
        }
        return origDefine(name, constructor, options);
      };
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
