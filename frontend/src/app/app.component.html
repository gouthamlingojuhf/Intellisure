<header class="brand-shell-header">
  <nav class="brand-shell-nav">
    <a routerLink="/" class="brand-shell-logo">IntelliSure</a>
    <div class="brand-shell-links">
      <a routerLink="/auth">Login</a>
      <a routerLink="/policy">Quotes &amp; Policies</a>
      <a routerLink="/underwriting">Underwriting</a>
      <a routerLink="/claims">Claims</a>
      <a routerLink="/vendor">Vendors</a>
      <a routerLink="/analytics">Analytics</a>
      <a routerLink="/recovery">Recovery</a>
      <a routerLink="/docs">Docs</a>
    </div>
    <div class="brand-shell-actions">
      @if (isAuthenticated$ | async) {
        <span class="brand-status-pill">{{ (role$ | async) ?? 'USER' }}</span>
        <button class="brand-ghost-btn" (click)="logout()">Logout</button>
      }
    </div>
  </nav>
</header>

@if (loading$ | async) {
  <div class="global-loader">Loading…</div>
}

<div class="toast-stack">
  @for (t of toasts$ | async; track t.id) {
    <div
      class="toast-item"
      [class.toast-success]="t.kind === 'success'"
      [class.toast-error]="t.kind === 'error'"
      [class.toast-info]="t.kind === 'info'"
    >
      {{ t.message }}
      <button (click)="dismiss(t.id)">dismiss</button>
    </div>
  }
</div>

<main class="brand-shell-main">
  <router-outlet />
</main>
