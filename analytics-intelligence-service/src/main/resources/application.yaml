server:
  port: 8089

spring:
  application:
    name: analytics-intelligence-service
  r2dbc:
    url: r2dbc:mysql://localhost:3306/analytics_intelligence_db
    username: root
    password:
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
