server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:4201"
              - "http://localhost:4202"
              - "http://localhost:4203"
              - "http://localhost:4205"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Correlation-ID
              - Accept
              - Origin
            allowCredentials: true
            maxAge: 3600
      server:
        webflux:
          routes:

            - id: customer-party-service
              uri: lb://customer-party-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/customers/**,/api/admin/**

            - id: quote-policy-service
              uri: lb://quote-policy-service
              predicates:
                - Path=/api/quotes/**,/api/policies/**

            - id: risk-underwriting-service
              uri: lb://risk-underwriting-service
              predicates:
                - Path=/api/risk-assessments/**,/api/referrals/**,/api/subjectivities/**,/api/decisions/**,/api/risk-rules/**

            - id: claims-service
              uri: lb://claims-service
              predicates:
                - Path=/api/claims/**

            - id: vendor-partner-service
              uri: lb://vendor-partner-service
              predicates:
                - Path=/api/vendors/**,/api/vendor-assignments/**,/api/partners/**

            - id: workflow-notification-service
              uri: lb://workflow-notification-service
              predicates:
                - Path=/api/workflows/**,/api/notifications/**

            - id: recovery-service
              uri: lb://recovery-service
              predicates:
                - Path=/api/recovery/**,/api/business-continuity/**

            - id: document-audit-service
              uri: lb://document-audit-service
              predicates:
                - Path=/api/documents/**,/api/audit/**,/api/audit-events/**

            - id: analytics-intelligence-service
              uri: lb://analytics-intelligence-service
              predicates:
                - Path=/api/analytics/**,/api/intelligence/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway

  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    use-root-path: true
    urls:
      - name: Customer & Party Service
        url: /api/users/v3/api-docs
      - name: Quote & Policy Service
        url: /api/quotes/v3/api-docs
      - name: Risk & Underwriting Service
        url: /api/underwriting/v3/api-docs
      - name: Claims Service
        url: /api/claims/v3/api-docs
      - name: Vendor & Partner Service
        url: /api/vendors/v3/api-docs
      - name: Workflow & Notification Service
        url: /api/workflows/v3/api-docs
      - name: Recovery & Business Continuity Service
        url: /api/recovery/v3/api-docs
      - name: Document & Audit Service
        url: /api/documents/v3/api-docs
      - name: Analytics & Intelligence Service
        url: /api/analytics/v3/api-docs

jwt:
  secret: VVGF9BeSRx3K2epQp4/DRnq881+8YixWG3KHI4qTl9I=

logging:
  level:
    root: INFO
    com.intellisure: INFO
    org.springframework.security: WARN
    org.springframework.r2dbc: WARN
    io.asyncer.r2dbc.mysql: WARN
    reactor.netty.http.client: WARN

  pattern:
    console: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
      %-5level
      [%thread]
      %logger{36}
      - %msg%n

  file:
    name: logs/${spring.application.name}.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
